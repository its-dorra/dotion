name: dotion

services:
  postgres:
    image: postgres:18
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dotion
      POSTGRES_PASSWORD: dotion
      POSTGRES_DB: dotion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      - PG_CONNECTION_STRING=postgres://dotion:dotion@postgres:5432/dotion
    ports:
      - '4444:4444'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: